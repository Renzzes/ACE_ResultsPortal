      security:
        - staffBearer: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Allowed recipients
        "401":
          $ref: "#/components/responses/Unauthorized"

  /messages/unread-count:
    get:
      operationId: getMessageUnreadCount
      tags: [messages]
      summary: Count of threads with unread messages for the caller
      security:
        - staffBearer: []
      responses:
        "200":
          description: Unread thread count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }

  /messages/threads:
    get:
      operationId: listMessageThreads
      tags: [messages]
      summary: List threads where the caller is a participant
      security:
        - staffBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Thread list
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMessageThread
      tags: [messages]
      summary: Open or create a 1-to-1 thread with an authorized recipient
      description: |
        Subject and body are optional. An existing open 1-to-1 thread for the same
        pair is reused. A new thread is created only when none is open.
      security:
        - staffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageThreadRequest"
      responses:
        "200":
          description: Existing open 1-to-1 thread reused
        "201":
          description: Created thread
        "403":
          $ref: "#/components/responses/Forbidden"

  /messages/threads/{id}:
    get:
      operationId: getMessageThread
      tags: [messages]
      summary: Get a thread the caller participates in
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread with messages
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMessageThread
      tags: [messages]
      summary: Permanently delete a thread the caller participates in
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /messages/threads/{id}/messages:
    post:
      operationId: sendThreadMessage
      tags: [messages]
      summary: Send a message in a participated open thread
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        "201":
          description: Created message
        "403":
          $ref: "#/components/responses/Forbidden"

  /messages/threads/{id}/read:
    post:
      operationId: markMessageThreadRead
      tags: [messages]
      summary: Update the caller's last_read_at for a thread
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked read
        "403":
          $ref: "#/components/responses/Forbidden"

  /messages/threads/{id}/close:
    post:
      operationId: closeMessageThread
      tags: [messages]
      summary: Close a thread the caller participates in
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread closed
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Staff/physician access JWT. Claim `type` must be `access`.
        Header `Authorization: Bearer <token>`. Expires in 15 minutes.
    portalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Patient portal JWT. Claim `type` must be `portal`.
        Header `Authorization: Bearer <token>`. Expires in 4 hours.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
      required:
        - status

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    DownloadUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: Relative API path such as `/api/results/file/{token}`. Never a filesystem path.
        expiresAt:
          type: string
          format: date-time

    ResultCategory:
      type: string
      enum: [laboratory, radiology, ultrasound, ct_scan, mri, ecg, echo_2d, rehabilitation, other]

    ResultStatus:
      type: string
      enum: [pending, released, archived]

    # Auth schemas
    LoginCredentials:
      type: object
      required: [username, password, portal]
      properties:
        username:
          type: string
        password:
          type: string
        portal:
          type: string
          enum: [admin, staff, doctor, patient]
          description: Login channel stored on the session. Does not grant or replace the user role.

    SessionRefreshResponse:
      type: object
      required: [accessToken, sessionPublicId]
      properties:
        accessToken:
          type: string
          description: New access JWT. Includes sid equal to sessionPublicId. Does not include the refresh secret.
        sessionPublicId:
          type: string
          minLength: 22
          maxLength: 22
          description: Stable public session handle. Not a secret.

    AuthResponse:
      type: object
      required: [accessToken, sessionPublicId, user]
      properties:
        accessToken:
          type: string
          description: Access JWT. New logins include sid. Does not include the refresh secret.
        sessionPublicId:
          type: string
          minLength: 22
          maxLength: 22
          description: Public session handle. Safe to keep. Not the refresh secret.
        user:
          $ref: "#/components/schemas/User"

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    ResetPasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8

    # User schemas
    User:
      type: object
      required: [id, username, firstName, lastName, role, isActive, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [super_admin, medical_records, laboratory, radiology, endoscopy, physician]
        isActive:
          type: boolean
        createdAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]

    UserInput:
      type: object
      required: [username, password, firstName, lastName, role]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, medical_records, laboratory, radiology, endoscopy, physician]

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [super_admin, medical_records, laboratory, radiology, endoscopy, physician]
        isActive:
          type: boolean

    UserListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Patient schemas
    Patient:
      type: object
      required: [id, patientHisId, lastName, firstName, dateOfBirth, createdAt, updatedAt]
      properties:
        id:
          type: integer
        patientHisId:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: ["string", "null"]
        dateOfBirth:
          type: string
        mobileNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        accessCode:
          type: ["string", "null"]
          description: Present only immediately after create or regenerate. Stored as a hash thereafter.
        accessCodeRequestedAt:
          type: ["string", "null"]
          description: ISO timestamp when the patient requested a new results access code from admin.
        createdAt:
          type: string
        updatedAt:
          type: string
        resultCount:
          type: integer
        assignedPhysicians:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
              name:
                type: string

    PhysicianSummary:
      type: object
      required: [id, name, username]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string

    AssignedPhysician:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        assignedAt:
          type: string

    AssignPhysicianInput:
      type: object
      required: [physicianId]
      properties:
        physicianId:
          type: integer

    PatientInput:
      type: object
      required: [patientHisId, lastName, firstName, dateOfBirth]
      properties:
        patientHisId:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        dateOfBirth:
          type: string
        mobileNumber:
          type: string
        email:
          type: string
        physicianId:
          type: integer
          description: Optional attending physician user id to assign at creation.

    PatientUpdate:
      type: object
      properties:
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: ["string", "null"]
        dateOfBirth:
          type: string
        mobileNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]

    PatientListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Result schemas
    Result:
      type: object
      required: [id, patientId, category, fileName, originalFileName, fileType, releaseOption, status, uploadedById, uploadedAt, createdAt]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientHisId:
          type: string
        patientName:
          type: string
        category:
          $ref: "#/components/schemas/ResultCategory"
        fileName:
          type: string
          description: Relative storage key (legacy basename or `results/{id}/result.{ext}`). Not an OS path.
        originalFileName:
          type: string
          description: Sanitized original filename for Content-Disposition only.
        fileType:
          type: string
          enum: [pdf, jpeg, png]
        fileSizeBytes:
          type: integer
        releaseOption:
          type: string
          enum: [immediate, after_physician_review, scheduled]
        scheduledReleaseDate:
          type: ["string", "null"]
        dateReleased:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ResultStatus"
        remarks:
          type: ["string", "null"]
        uploadedById:
          type: integer
        uploadedByName:
          type: string
        uploadedAt:
          type: string
        createdAt:
          type: string
        assignedPhysician:
          type: ["object", "null"]
          description: Reviewing physician for private result assignment (Phase 7B). Null when unassigned.
          properties:
            id:
              type: integer
            name:
              type: string
        assignedPhysicians:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        reviews:
          type: array
          description: Staff view of assigned physicians left-joined to their reviews. Omitted when review storage is not installed, and omitted from physician responses.
          items:
            $ref: "#/components/schemas/StaffResultReview"
        myReview:
          $ref: "#/components/schemas/PhysicianResultReview"

    ResultReviewInput:
      type: object
      properties:
        comment:
          type: ["string", "null"]
          description: Optional physician comment. Omitted, null, or whitespace-only is stored as null. Maximum 4000 characters.

    ResultReview:
      type: object
      required: [resultId, physicianId, reviewed, reviewedAt]
      properties:
        resultId:
          type: integer
        physicianId:
          type: integer
        physicianName:
          type: string
        reviewed:
          type: boolean
        reviewedAt:
          type: string
          format: date-time
        comment:
          type: ["string", "null"]

    StaffResultReview:
      type: object
      required: [physicianId, physicianName, reviewed]
      properties:
        physicianId:
          type: integer
        physicianName:
          type: string
        reviewed:
          type: boolean
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        comment:
          type: ["string", "null"]

    PhysicianResultReview:
      type: object
      required: [reviewed]
      properties:
        reviewed:
          type: boolean
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        comment:
          type: ["string", "null"]

    ResultUploadInput:
      type: object
      required: [file, patientId, category, releaseOption]
      properties:
        file:
          type: string
          format: binary
          description: Diagnostic file. Field name `file`. PDF, JPEG, or PNG. Maximum 50 MiB unless the configured max file size overrides.
        patientId:
          type: integer
        category:
          $ref: "#/components/schemas/ResultCategory"
        releaseOption:
          type: string
          enum: [immediate, after_physician_review, scheduled]
        scheduledReleaseDate:
          type: string
        remarks:
          type: string
        physicianId:
          type: integer
          description: Optional reviewing physician user id. Server validates active physician role; client value is never trusted for authorization.
        assignedPhysicianId:
          type: integer
          description: Alias for physicianId (optional).

    ResultAssignmentInput:
      type: object
      properties:
        physicianId:
          type: ["integer", "null"]
          description: Reviewing physician user id, or null to clear assignment. Server validates active physician role.

    ResultUpdate:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/ResultCategory"
        releaseOption:
          type: string
          enum: [immediate, after_physician_review, scheduled]
        scheduledReleaseDate:
          type: ["string", "null"]
        remarks:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ResultStatus"

    ReleaseResultInput:
      type: object
      required: [releaseOption]
      properties:
        releaseOption:
          type: string
          enum: [immediate, after_physician_review, scheduled]
        scheduledReleaseDate:
          type: ["string", "null"]

    ResultListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Result"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Patient Portal schemas
    PortalIdentityVerification:
      type: object
      required: [patientHisId, lastName, dateOfBirth]
      properties:
        patientHisId:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          description: ISO date (YYYY-MM-DD)

    PortalIdentityVerificationResult:
      type: object
      required: [verified, isNewPortalAccount]
      properties:
        verified:
          type: boolean
          const: true
        isNewPortalAccount:
          type: boolean
        registrationToken:
          type: string
          description: Short-lived token for step 2 registration (new accounts only)

    PortalAccountRegistration:
      type: object
      required: [registrationToken, email, confirmEmail, password, confirmPassword]
      properties:
        registrationToken:
          type: string
        email:
          type: string
          format: email
        confirmEmail:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128

    PortalAccountRegistrationResult:
      type: object
      required: [created, accessCode, patient]
      properties:
        created:
          type: boolean
          const: true
        accessCode:
          type: string
          description: Plaintext access code returned only once
        patient:
          $ref: "#/components/schemas/PortalVerifiedPatient"

    PortalRecoveryRequestResult:
      type: object
      properties:
        recoveryToken:
          type: string
        maskedEmail:
          type: string
        message:
          type: string
        assistedRecovery:
          type: boolean

    PortalRecoveryConfirm:
      type: object
      required: [recoveryToken, otp, newPassword]
      properties:
        recoveryToken:
          type: string
        otp:
          type: string
          pattern: "^\\d{6}$"
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    PortalVerifiedPatient:
      type: object
      required: [id, patientHisId]
      properties:
        id:
          type: integer
        patientHisId:
          type: string
        firstName:
          type: string
        middleName:
          type: ["string", "null"]
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date

    PatientAccessVerification:
      type: object
      required: [patientHisId, lastName, accessCode]
      properties:
        patientHisId:
          type: string
        lastName:
          type: string
        accessCode:
          type: string

    PatientPortalSession:
      type: object
      required: [sessionToken, patient]
      properties:
        sessionToken:
          type: string
        patient:
          $ref: "#/components/schemas/PatientPublicInfo"

    PatientPublicInfo:
      type: object
      required: [id, patientHisId, firstName, lastName]
      properties:
        id:
          type: integer
        patientHisId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]

    PortalResult:
      type: object
      required: [id, category, originalFileName, fileType, status, uploadedAt, dateReleased]
      properties:
        id:
          type: integer
        category:
          type: string
        originalFileName:
          type: string
        fileType:
          type: string
        fileSizeBytes:
          type: integer
        status:
          type: string
        remarks:
          type: ["string", "null"]
        uploadedAt:
          type: string
        dateReleased:
          type: ["string", "null"]
        locked:
          type: boolean
          description: >
            True when the request did not include a valid access code.
            Listing is allowed while locked; document content is not.

    PortalOverviewPatient:
      type: object
      required: [id, patientHisId, firstName, lastName, dateOfBirth]
      properties:
        id:
          type: integer
        patientHisId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]
        dateOfBirth:
          type: string
        mobileNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]

    PortalProfile:
      type: object
      required:
        - patientHisId
        - firstName
        - lastName
        - dateOfBirth
        - accountStatus
      properties:
        patientHisId:
          type: string
        firstName:
          type: string
        middleName:
          type: ["string", "null"]
        lastName:
          type: string
        dateOfBirth:
          type: string
        email:
          type: ["string", "null"]
        mobileNumber:
          type: ["string", "null"]
        accountStatus:
          type: string
          enum: [active]
        accountEmail:
          type: ["string", "null"]
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    PortalProfileUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        mobileNumber:
          type: ["string", "null"]
          maxLength: 32
      additionalProperties: false

    PortalAssignedDoctor:
      type: object
      required: [id, name, assignedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        assignedAt:
          type: string
          format: date-time

    PortalOverview:
      type: object
      required: [patient, assignedDoctors, appointments]
      properties:
        patient:
          $ref: "#/components/schemas/PortalOverviewPatient"
        assignedDoctors:
          type: array
          items:
            $ref: "#/components/schemas/PortalAssignedDoctor"
        appointments:
          $ref: "#/components/schemas/PortalAppointments"

    PortalAppointment:
      type: object
      required: [id, reference, date, status, reasonForVisit]
      properties:
        id:
          type: string
        reference:
          type: string
        date:
          type: string
          format: date
        time:
          type: ["string", "null"]
        status:
          type: string
        doctorName:
          type: ["string", "null"]
        departmentName:
          type: ["string", "null"]
        specialtyName:
          type: ["string", "null"]
        reasonForVisit:
          type: string

    PortalAppointments:
      type: object
      required: [status, today, next]
      properties:
        status:
          type: string
          enum: [ok, unavailable, unconfigured]
        today:
          type: array
          items:
            $ref: "#/components/schemas/PortalAppointment"
        next:
          oneOf:
            - $ref: "#/components/schemas/PortalAppointment"
            - type: "null"
        message:
          type: string

    PortalCareHistorySource:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable, unconfigured]
        message:
          type: string

    PortalCareHistorySources:
      type: object
      required: [appointments, results, prescriptions]
      properties:
        appointments:
          $ref: "#/components/schemas/PortalCareHistorySource"
        results:
          $ref: "#/components/schemas/PortalCareHistorySource"
        prescriptions:
          $ref: "#/components/schemas/PortalCareHistorySource"

    PortalCareHistoryEvent:
      type: object
      required: [type, date, title, subtitle, summary, href, entityId, appointmentId, doctorName, status, appointment]
      properties:
        type:
          type: string
          enum: [appointment, result, prescription]
        date:
          type: string
          description: Event date/time used for ordering (ISO or date+time composite)
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        href:
          type: ["string", "null"]
        entityId:
          type: ["integer", "null"]
        appointmentId:
          type: ["string", "null"]
        doctorName:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        appointment:
          oneOf:
            - $ref: "#/components/schemas/PortalAppointment"
            - type: "null"

    PortalCareHistory:
      type: object
      required: [events, sources]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/PortalCareHistoryEvent"
        sources:
          $ref: "#/components/schemas/PortalCareHistorySources"

    # Physician Portal schemas
    PhysicianPatientView:
      type: object
      required: [id, patientHisId, firstName, lastName, dateOfBirth, resultCount]
      properties:
        id:
          type: integer
        patientHisId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]
        dateOfBirth:
          type: string
        resultCount:
          type: integer

    # Audit Log schemas
    AuditLog:
      type: object
      required: [id, action, userId, userName, ipAddress, createdAt]
      properties:
        id:
          type: integer
        action:
          type: string
          enum: [login, logout, upload, edit, delete, view, download, access_denied, access_code_regen]
        userId:
          type: ["integer", "null"]
        userName:
          type: ["string", "null"]
        patientHisId:
