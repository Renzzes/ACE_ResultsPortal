                  $ref: "#/components/schemas/AuditLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /dashboard/daily-uploads:
    get:
      operationId: getDailyUploads
      tags: [dashboard]
      summary: Get daily upload counts for the last 30 days
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`.
      responses:
        "200":
          description: Daily upload counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyUploadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /dashboard/top-users:
    get:
      operationId: getTopActiveUsers
      tags: [dashboard]
