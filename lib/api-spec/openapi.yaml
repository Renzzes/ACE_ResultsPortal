          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Unable to load dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Archived Records
  /archive:
    get:
      operationId: listArchivedResults
      tags: [archive]
      summary: List archived results
      description: |
        Requires staff access JWT. Roles `super_admin`, `medical_records`.
        Archive is a status, not a file move.
      security:
        - staffBearer: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Archived results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /archive/{id}/restore:
    post:
      operationId: restoreArchivedResult
      tags: [archive]
      summary: Restore an archived result to pending
      description: |
        Requires staff access JWT. Roles `super_admin`, `medical_records`.
        Sets status to `pending` (not `released`). Physical file is unchanged.
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result restored to pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the authenticated user
      security:
        - staffBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: unreadOnly
          in: query
          schema: { type: string, enum: ["0", "1", "true", "false"] }
      responses:
        "200":
          description: Paginated notifications for the current user only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/BadRequest"

  /notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      tags: [notifications]
      summary: Unread notification count for the authenticated user
      security:
        - staffBearer: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    post:
