openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    ACE Results Portal HTTP contract. This document describes the **implemented** API.
    Middleware is authoritative for authentication and RBAC; this spec is documentation.

    **Staff access JWT** (`Authorization: Bearer`, claim `type=access`, 15 minutes).
    New access tokens also carry `sid`, the public session id. `sid` is not a role.
    **Refresh secret** for a new session is an opaque value stored only as a hash.
    It is set as HttpOnly cookie `ace_rt_<sid>` (`path=/api/auth`, SameSite=Lax, Secure in production).
    `POST /auth/session/{sessionPublicId}/refresh` rotates that secret and keeps the same `sid`.
    `POST /auth/session/{sessionPublicId}/logout` revokes only that session.
    The refresh secret is never returned in JSON. Cookie `ace_refresh_token` is not issued.
    **Portal JWT** (`type=portal`, 4 hours) is issued by `POST /portal/login` and, for new logins, includes `sid`.
    **Download JWT** (`type=download`, 5 minutes) is a path token, not a filesystem path.

    Staff roles: `super_admin`, `medical_records`, `laboratory`, `radiology`, `physician`.
    Unhandled failures return HTTP 500 `{ "error": "Internal server error" }`.
    JSON errors use `{ "error": string }`. Oversized uploads return **400**, not 413.
servers:
  - url: /api
    description: Base API path
security:
  - staffBearer: []
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: Staff user management
  - name: patients
    description: Patient record management
  - name: results
    description: Diagnostic result management
  - name: patient-portal
    description: Patient-facing portal
  - name: physician-portal
    description: Physician portal
  - name: audit
    description: Audit log management
  - name: dashboard
    description: Dashboard and reporting
  - name: admin
    description: Administrator overview (super_admin)
  - name: archive
    description: Records archiving
  - name: notifications
    description: Per-user in-app notifications
  - name: announcements
    description: Admin announcements and audience targeting
  - name: messages
    description: Thread-based staff/physician messaging
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status. No authentication.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Staff/physician login
      description: |
        Public. Rate limited (20 / 15 minutes → 429).
        Requires `portal` channel: `admin`, `staff`, `doctor`, or `patient`.
        The channel is session metadata and does not change the user's role.
        Creates one `auth_sessions` row with `public_id` and `portal`.
        Sets HttpOnly cookie `ace_rt_<sessionPublicId>` (path=/api/auth, SameSite=Lax, 7 days, Secure in production).
        Does not set cookie `ace_refresh_token`. If that cookie is presented, the response expires it.
        Access token is JSON (15m) and includes `sid` = `sessionPublicId`.
        The response does not include a refresh secret.
        Does not return password hashes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly `ace_rt_<sessionPublicId>` (path=/api/auth, SameSite=Lax, 7 days).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account locked after failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/session/{sessionPublicId}/refresh:
    post:
      operationId: refreshAuthSession
      tags: [auth]
      summary: Refresh one portal session
      description: |
        Public. Rate limited (20 / 15 minutes → 429).
        Reads the refresh secret from HttpOnly cookie `ace_rt_<sessionPublicId>` only.
        Rejects a missing, revoked, expired, or portal-less session, and a secret that does not match the stored hash.
        Rotates the refresh secret, keeps the same `public_id`, and returns a new access token whose `sid` is that id.
        Does not return the refresh secret. Does not create another auth_sessions row.
        SameSite=Lax and POST (no GET) are the CSRF controls. Secure is set in production only.
      security: []
      parameters:
        - name: sessionPublicId
          in: path
          required: true
          schema:
            type: string
            minLength: 22
            maxLength: 22
          description: Public session handle. Not a secret.
      responses:
        "200":
          description: New access token for the same session
          headers:
            Set-Cookie:
              description: Replacement HttpOnly `ace_rt_<sessionPublicId>`. The previous secret no longer matches.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/session/{sessionPublicId}/logout:
    post:
      operationId: logoutAuthSession
      tags: [auth]
      summary: Revoke one portal session
      description: |
        Requires the caller's staff access JWT or patient portal JWT.
        Revokes only the session whose `public_id` is `sessionPublicId` when that row belongs to the caller.
        Does not revoke other sessions for the same user.
        Clears only cookie `ace_rt_<sessionPublicId>`.
        Missing sessions and sessions owned by someone else both return 401.
        POST only. SameSite=Lax. No GET logout.
      security:
        - staffBearer: []
        - portalBearer: []
      parameters:
        - name: sessionPublicId
          in: path
          required: true
          schema:
            type: string
            minLength: 22
            maxLength: 22
          description: Public session handle. Not a secret.
      responses:
        "200":
          description: That session was revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      description: Requires staff access JWT. Any authenticated staff role.
      security:
        - staffBearer: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change current user password
      description: Requires staff access JWT. Any authenticated staff role.
      security:
        - staffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Users (staff/admin management)
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all staff users
      description: Requires staff access JWT. Role `super_admin` only.
      security:
        - staffBearer: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new staff user
      description: Requires staff access JWT. Role `super_admin` only. Does not return the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a staff user by ID
      description: Requires staff access JWT. Role `super_admin` only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a staff user
      description: Requires staff access JWT. Role `super_admin` only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Deactivate a staff user
      description: Requires staff access JWT. Role `super_admin` only. Sets `isActive=false`; does not hard-delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Admin reset of user password
      description: Requires staff access JWT. Role `super_admin` only. Does not return the new password.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Patients
  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patient records
      description: |
        Requires staff access JWT. Physicians only see assigned patients.
        Other staff roles see all patients.
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient record
      description: |
        Requires staff access JWT. Roles `super_admin`, `medical_records`, `laboratory`, `radiology`.
        Response includes plaintext `accessCode` once; it is stored hashed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Patient created with access code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient record by internal ID
      description: Requires staff access JWT. Physicians must be assigned to the patient.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient record
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete patient record
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /patients/{id}/regenerate-access-code:
    post:
      operationId: regenerateAccessCode
      tags: [patients]
      summary: Regenerate patient access code
      description: |
        Requires staff access JWT. Roles `super_admin`, `medical_records`, `laboratory`, `radiology`.
        Response includes plaintext `accessCode` once.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New access code generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /patients/{id}/results:
    get:
      operationId: listPatientResultsStaff
      tags: [patients]
      summary: Get all results for a patient (staff view)
      description: |
        Requires staff access JWT. Physicians must be assigned and receive only `released` results.
        Laboratory/radiology are scoped by category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /physicians:
    get:
      operationId: listPhysicians
      tags: [users]
      summary: List active physicians for assignment
      description: Requires staff access JWT. Any authenticated staff role.
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Physicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhysicianSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patients/{id}/physicians:
    get:
      operationId: listPatientPhysicians
      tags: [patients]
      summary: List physicians assigned to a patient
      description: Requires staff access JWT. Physicians must be assigned to the patient.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assigned physicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignedPhysician"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: assignPatientPhysician
      tags: [patients]
      summary: Assign a physician to a patient
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPhysicianInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /patients/{id}/physicians/{physicianId}:
    delete:
      operationId: unassignPatientPhysician
      tags: [patients]
      summary: Remove a physician assignment
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: physicianId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Results
  /results:
    get:
      operationId: listResults
      tags: [results]
      summary: List all results
      description: |
        Requires staff access JWT. Physicians see assigned patients' `released` results only.
        Laboratory/radiology are scoped by category.
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ResultCategory"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ResultStatus"
        - name: uploadedBy
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Filter by patient first name, last name, or HIS ID
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /results/upload:
    post:
      operationId: uploadResult
      tags: [results]
      summary: Upload a diagnostic result file
      description: |
        Requires staff access JWT. Roles `super_admin`, `medical_records`, `laboratory`, `radiology`.
        Laboratory may upload `laboratory` only. Radiology may upload imaging categories.
        Multipart field `file` is required. Stored path is application-generated; clients never send filesystem paths.
        Supported types PDF/JPEG/PNG. Maximum size 50 MiB (`RESULT_MAX_FILE_BYTES`). Oversize → 400, not 413.
      security:
        - staffBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ResultUploadInput"
            encoding:
              file:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        "201":
          description: Result uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /results/{id}:
    get:
      operationId: getResult
      tags: [results]
      summary: Get result details
      description: Requires staff access JWT. Same authorization as download (RBAC + assignment + release rules).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateResult
      tags: [results]
      summary: Update result metadata
      description: |
        Requires staff access JWT. Roles `super_admin`, `medical_records`, `laboratory`, `radiology`
        within department scope. Status `archived` is a database status change only; files are not moved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultUpdate"
      responses:
        "200":
          description: Result updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteResult
      tags: [results]
      summary: Delete a result
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`. Deletes metadata and the stored file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /results/{id}/assignment:
    put:
      operationId: putResultAssignment
      tags: [results]
      summary: Assign or clear physician copy for a result
      description: |
        Requires staff upload permission within category scope.
        Creates a private read-only result copy for continuity of care.
        Does not change patient visibility or result release status.
        Does not implement physician approval or rejection.
        Server validates physicianId is an active user with role physician.
        Reassignment revokes prior physician access immediately.
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultAssignmentInput"
      responses:
        "200":
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Assignment schema not installed

  /results/{id}/review:
    put:
      operationId: putResultReview
      tags: [results]
      summary: Save the authenticated physician's review of one result
      description: |
        Requires a physician access JWT. The reviewer is the authenticated user.
        `physicianId` and `reviewedAt` in the body are not accepted as the review identity or timestamp.
        Optional comment. Whitespace-only comments are stored as null. Comments longer than 4000 characters are rejected.
        A repeat review by the same physician updates that physician's row and sets `reviewedAt` to the latest server time.
        Other physicians' reviews are unchanged. This does not change result status, remarks, release, archive, or assignments.
        Returns 503 when `dbo.result_reviews` is not installed. Run `docs/migration/sql/014_result_reviews.sql` against ACE_ResultsPortal.
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultReviewInput"
      responses:
        "200":
          description: Persisted review for the authenticated physician
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Physician review storage is not installed. Run docs/migration/sql/014_result_reviews.sql against ACE_ResultsPortal.

  /results/{id}/release:
    post:
      operationId: releaseResult
      tags: [results]
      summary: Release a result to patient
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`, `laboratory`, `radiology` within department scope.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseResultInput"
      responses:
        "200":
          description: Result released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /results/{id}/regenerate-access-code:
    post:
      operationId: regenerateResultAccessCode
      tags: [results]
      summary: Regenerate document access code and email it
      description: |
        Requires staff access JWT. Rotates the document-specific access code, stores bcrypt+AES material,
        and emails the new code to the patient recipient. Does not return the plaintext code.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                recipientEmail: { type: string, format: email }
      responses:
        "200":
          description: Code regenerated and email accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      accessCodeEmail:
                        type: object
                        properties:
                          accepted: { type: boolean }
                          status: { type: string }
                          emailedToMasked: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /results/{id}/resend-access-code:
    post:
      operationId: resendResultAccessCode
      tags: [results]
      summary: Resend existing document access code email
      description: |
        Requires staff access JWT. Re-emails the current document access code without rotating it.
        Does not return the plaintext code.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                recipientEmail: { type: string, format: email }
      responses:
        "200":
          description: Email accepted for the existing code
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      accessCodeEmail:
                        type: object
                        properties:
                          accepted: { type: boolean }
                          status: { type: string }
                          emailedToMasked: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /results/{id}/print-ready:
    get:
      operationId: getResultPrintReady
      tags: [results]
      summary: Generate print-ready PDF with document access code header
      description: |
        Requires staff access JWT. Returns a derived PDF with the document-specific access code
        in the header on every page. Source PDF on disk is not modified.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Print-ready PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /results/{id}/download:
    get:
      operationId: getResultDownloadUrl
      tags: [results]
      summary: Get signed download URL for a result (staff)
      description: |
        Requires staff access JWT. Authorization is re-checked. Returns a relative `/api/results/file/{token}` URL
        (5 minutes). Does not return filesystem paths.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /results/file/{token}:
    get:
      operationId: downloadResultFile
      tags: [results]
      summary: Stream a result file using a short-lived download token
      description: |
        No Bearer header. Token is a download JWT (`type=download`, `forType=staff`, 5 minutes).
        Server re-authenticates the subject and re-authorizes the result before streaming.
        Does not expose storage-root directories or OS paths.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes (PDF, JPEG, or PNG)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Patient Portal
  /portal/verify-identity:
    post:
      operationId: verifyPortalPatientIdentity
      tags: [patient-portal]
      summary: Verify hospital patient identity for portal registration
      description: |
        Public. Rate limited (10 / 15 minutes → 429). Step 1 of registration: verifies Hospital Patient ID + last name + date of birth
        against LiveDB_ACE (read-only). Returns a short-lived registration token when no portal account exists.
        Does not create an account or issue an access code. Failed verification returns 401. HIS outage returns 503.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalIdentityVerification"
      responses:
        "200":
          description: Identity verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalIdentityVerificationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: HIS verification temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/register:
    post:
      operationId: registerPortalPatient
      tags: [patient-portal]
      summary: Create patient portal account after HIS verification
      description: |
        Public. Rate limited (10 / 15 minutes → 429). Step 2 of registration: requires a valid registration token
        from verify-identity plus patient-supplied email and password. Creates dbo.patients with HIS demographics and returns a
        one-time access code for viewing results. Email is stored for portal recovery only (not from LiveDB_ACE).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalAccountRegistration"
      responses:
        "200":
          description: Portal account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalAccountRegistrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account or email conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/recover/request:
    post:
      operationId: requestPortalAccessCodeRecovery
      tags: [patient-portal]
      summary: Start forgot password recovery
      description: |
        Public. Rate limited (10 / 15 minutes → 429). Verifies hospital identity, then sends a 6-digit OTP to the
        patient's registered portal email when SMTP is configured. Does not reveal whether a portal account exists.
        Accounts without a portal email receive an assisted-recovery response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalIdentityVerification"
      responses:
        "200":
          description: Recovery initiated or generic acknowledgment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRecoveryRequestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: HIS or email delivery unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/recover/verify:
    post:
      operationId: verifyPortalRecoveryOtp
      tags: [patient-portal]
      summary: Verify the password-recovery email code
      description: |
        Public. Rate limited (10 / 15 minutes → 429). Checks the 6-digit code for an active recovery token
        and marks that recovery transaction as OTP-verified. Does not change the password and does not return the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryToken, otp]
              properties:
                recoveryToken: { type: string }
                otp: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: OTP accepted
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /portal/recover/confirm:
    post:
      operationId: confirmPortalAccessCodeRecovery
      tags: [patient-portal]
      summary: Confirm password recovery OTP and set new password
      description: |
        Public. Rate limited (10 / 15 minutes → 429). Requires a recovery token whose OTP was already verified, then sets a new portal login password,
        then emails confirmation only after the password is updated. Recovery credentials are single-use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalRecoveryConfirm"
      responses:
        "200":
          description: Password reset complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Email delivery unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/verify:
    post:
      operationId: verifyPatientAccess
      tags: [patient-portal]
      summary: Unlock a diagnostic document with its access code
      description: |
        Requires portal JWT. Rate limited (20 / 15 minutes → 429).
        Validates a document-specific access code for the given `resultId`.
        A valid code unlocks only that document for the authenticated patient.
        Portal sign-in uses `POST /portal/login` with Hospital Patient ID and password instead.
      security:
        - portalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessCode, resultId]
              properties:
                accessCode: { type: string, maxLength: 32 }
                resultId: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Document access granted for this session
          content:
            application/json:
              schema:
                type: object
                required: [unlocked, resultId]
                properties:
                  unlocked: { type: boolean, enum: [true] }
                  resultId: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /portal/notifications:
    get:
      operationId: listPortalNotifications
      tags: [patient-portal]
      summary: List notifications for the authenticated Patient Portal user
      description: |
        Requires portal JWT. Recipient is resolved server-side:
        JWT.patientId → patients.id → patients.portal_user_id → users.id.
        Never accepts recipient_user_id from the client.
      security:
        - portalBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: unreadOnly
          in: query
          schema: { type: string, enum: ["0", "1", "true", "false"] }
      responses:
        "200":
          description: Paginated notifications for the current portal user only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/BadRequest"

  /portal/notifications/unread-count:
    get:
      operationId: getPortalNotificationUnreadCount
      tags: [patient-portal]
      summary: Unread notification count for the authenticated Patient Portal user
      security:
        - portalBearer: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/notifications/{id}/read:
    post:
      operationId: markPortalNotificationRead
      tags: [patient-portal]
      summary: Mark one of the current portal user's notifications as read
      security:
        - portalBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalNotification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/notifications/read-all:
    post:
      operationId: markAllPortalNotificationsRead
      tags: [patient-portal]
      summary: Mark all of the current portal user's notifications as read
      security:
        - portalBearer: []
      responses:
        "200":
          description: Number of rows updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/messages/recipients:
    get:
      operationId: listPortalMessageRecipients
      tags: [patient-portal]
      summary: List recipients the authenticated patient may message
      description: |
        Requires portal JWT. Returns only assigned physicians and authorized
        Medical Records / Admin support users. Recipient IDs are server-authorized.
        `search` must be at least 2 characters; shorter queries return an empty list.
        The search filters the authorized set and does not expose other accounts.
      security:
        - portalBearer: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Authorized recipients
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, role, category]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        role: { type: string }
                        category: { type: string, enum: [doctor, staff, admin] }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/messages/unread-count:
    get:
      operationId: getPortalMessageUnreadCount
      tags: [patient-portal]
      summary: Unread message thread count for the authenticated patient
      security:
        - portalBearer: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/messages:
    get:
      operationId: listPortalMessageThreads
      tags: [patient-portal]
      summary: List message threads for the authenticated patient
      security:
        - portalBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Patient-owned threads only
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/messages/threads:
    post:
      operationId: createPortalMessageThread
      tags: [patient-portal]
      summary: Open or create a patient 1-to-1 thread with an authorized recipient
      description: |
        patient_id and sender_user_id are derived server-side from the portal JWT.
        Client-supplied patientId / senderUserId / participants are ignored.
        Subject and body are optional. Selecting a recipient opens the existing open
        1-to-1 thread for that pair, or creates one. A message is stored only when body is sent.
      security:
        - portalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientUserId]
              properties:
                subject: { type: string, maxLength: 255 }
                body: { type: string, maxLength: 4000 }
                recipientUserId: { type: integer }
      responses:
        "200":
          description: Existing open 1-to-1 thread reused
        "201":
          description: Thread created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/messages/{threadId}:
    get:
      operationId: getPortalMessageThread
      tags: [patient-portal]
      summary: Get a patient-owned message thread
      security:
        - portalBearer: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread detail
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePortalMessageThread
      tags: [patient-portal]
      summary: Permanently delete a patient-owned message thread
      security:
        - portalBearer: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/messages/{threadId}/messages:
    post:
      operationId: sendPortalMessage
      tags: [patient-portal]
      summary: Send a message in a patient-owned thread
      security:
        - portalBearer: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Message created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/messages/{threadId}/read:
    post:
      operationId: markPortalMessageThreadRead
      tags: [patient-portal]
      summary: Mark the authenticated patient's participant row as read
      security:
        - portalBearer: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked read
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/messages/{threadId}/close:
    post:
      operationId: closePortalMessageThread
      tags: [patient-portal]
      summary: Close a patient-owned message thread
      security:
        - portalBearer: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/profile:
    get:
      operationId: getPortalProfile
      tags: [patient-portal]
      summary: Get authenticated patient profile
      description: |
        Requires portal JWT. Patient identity is derived from JWT.patientId only.
        Requires an activated portal account (portal_user_id → users.role=patient, is_active=1).
        HIS demographics are included as read-only fields. Does not expose hashes or portal_user_id.
      security:
        - portalBearer: []
      responses:
        "200":
          description: Patient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchPortalProfile
      tags: [patient-portal]
      summary: Update authenticated patient contact information
      description: |
        Requires portal JWT. Updates only email and/or mobileNumber for the authenticated patient.
        Client-supplied patientId and HIS identity fields are ignored and never written.
        Email uniqueness is enforced application-side. Does not write to LiveDB_ACE.
      security:
        - portalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Email unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/overview:
    get:
      operationId: getPortalOverview
      tags: [patient-portal]
      summary: Get authenticated patient profile, assigned physicians, and appointments
      description: |
        Requires portal JWT. Patient identity is derived from the portal session.
        Returns only the authenticated patient's demographics, assigned physicians, and
        read-only ShanScheduler appointments (today + next). Appointment patient mapping
        uses patients.patient_his_id against a configured ShanScheduler column.
        Does not invent clinical demographics (gender, blood type, address, etc.).
      security:
        - portalBearer: []
      responses:
        "200":
          description: Patient overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/care-history:
    get:
      operationId: getPortalCareHistory
      tags: [patient-portal]
      summary: Get unified care history for the authenticated patient
      description: |
        Requires portal JWT. Identity is derived exclusively from the portal session
        (`JWT.patientId`). Client-supplied `patientId` is ignored.

        Assembles a bounded timeline from:
        - ShanScheduler appointments (read-only; PatientHisId join only)
        - ACE_ResultsPortal released results the patient can already access
        - ACE_ResultsPortal prescriptions owned by the patient

        Source failures are isolated: scheduler unavailability does not clear
        results/prescriptions. Deep links are pointers only and must be re-authorized
        by destination endpoints. Does not write to ShanScheduler or LiveDB_ACE.
      security:
        - portalBearer: []
      responses:
        "200":
          description: Care history events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCareHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/results:
    get:
      operationId: getPortalResults
      tags: [patient-portal]
      summary: Get released results for authenticated patient
      description: Requires portal JWT. Own patient, `released` results only.
      security:
        - portalBearer: []
      responses:
        "200":
          description: Patient released results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/medications:
    get:
      operationId: listPortalMedications
      tags: [patient-portal]
      summary: List prescriptions for authenticated patient
      description: |
        Requires portal JWT and active portal account.
        Identity is JWT patientId only; client patientId query/body is ignored.
      security:
        - portalBearer: []
      responses:
        "200":
          description: Patient prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Prescriptions schema not installed

  /portal/medications/{id}:
    get:
      operationId: getPortalMedication
      tags: [patient-portal]
      summary: Get one prescription for authenticated patient
      description: |
        Requires portal JWT. Returns 404 for missing or foreign prescriptions.
      security:
        - portalBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Prescriptions schema not installed

  /portal/results/{id}/download:
    get:
      operationId: getPortalResultDownloadUrl
      tags: [patient-portal]
      summary: Get signed download URL for patient (portal)
      description: Requires portal JWT. Own patient and `released` only. Returns `/api/portal/file/{token}`.
      security:
        - portalBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/file/{token}:
    get:
      operationId: downloadPortalResultFile
      tags: [patient-portal]
      summary: Stream a released result file for the authenticated patient
      description: |
        No Bearer header. Download JWT `forType=portal`. Re-checks own patient + `released`.
        Does not expose storage paths.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/logout:
    post:
      operationId: patientPortalLogout
      tags: [patient-portal]
      summary: Patient portal logout
      description: |
        Requires a portal JWT that includes `sid`.
        Revokes only that session and clears `ace_rt_<sid>`.
        Does not revoke other sessions. A portal token without `sid` is rejected with 401.
      security:
        - portalBearer: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Physician Portal
  /physician/search:
    get:
      operationId: physicianSearchPatient
      tags: [physician-portal]
      summary: Physician searches for a patient by HIS ID or last name
      description: |
        Requires staff access JWT. Roles `physician` or `super_admin`.
        Physicians are limited to assigned patients. A single match returns one object;
        multiple matches return an array.
      security:
        - staffBearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Patient found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PhysicianPatientView"
                  - type: array
                    items:
                      $ref: "#/components/schemas/PhysicianPatientView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /physician/patients/{id}/results:
    get:
      operationId: listPatientResultsPhysician
      tags: [physician-portal]
      summary: Physician views patient results
      description: |
        Requires staff access JWT. Roles `physician` or `super_admin`.
        Physicians must be assigned and receive `released` results only.
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient results for physician
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /physician/patients/{patientId}/prescriptions:
    get:
      operationId: listPatientPrescriptionsPhysician
      tags: [physician-portal]
      summary: List prescriptions for an assigned patient
      description: |
        Requires staff access JWT with role physician.
        Requires patient_physicians assignment. Does not trust client physicianId.
      security:
        - staffBearer: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Prescriptions schema not installed
    post:
      operationId: createPatientPrescriptionPhysician
      tags: [physician-portal]
      summary: Create a prescription for an assigned patient
      description: |
        Requires staff access JWT with role physician and patient_physicians assignment.
        physicianId is derived from the authenticated session. Transactional create.
      security:
        - staffBearer: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrescriptionRequest"
      responses:
        "201":
          description: Prescription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Prescriptions schema not installed

  /physician/results/{id}/download:
    get:
      operationId: physicianGetResultDownloadUrl
      tags: [physician-portal]
      summary: Physician gets signed download URL
      description: |
        Requires staff access JWT. Roles `physician` or `super_admin`.
        Physicians require assignment and `released`. Returns `/api/physician/file/{token}`.
      security:
        - staffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /physician/file/{token}:
    get:
      operationId: downloadPhysicianResultFile
      tags: [physician-portal]
      summary: Stream a result file for an assigned physician
      description: |
        No Bearer header. Download JWT `forType=physician`. Re-checks assignment and `released`.
        Query `inline=1` uses Content-Disposition inline. Does not expose storage paths.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: inline
          in: query
          schema:
            type: string
            description: Set to `1` for inline Content-Disposition
      responses:
        "200":
          description: File bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Audit Logs
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      description: Requires staff access JWT. Roles `super_admin`, `medical_records`.
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: patientId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      description: Requires staff access JWT. Any authenticated staff role.
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/uploads-by-department:
    get:
      operationId: getUploadsByDepartment
      tags: [dashboard]
      summary: Get upload counts grouped by department/category
