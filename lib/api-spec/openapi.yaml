      responses:
        "200":
          description: Top active users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserActivityStat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Admin dashboard overview (live ACE_ResultsPortal data)
