kind = "web"
previewPath = "/"
title = "ACE Results Portal"
version = "1.0.0"
id = "artifacts/ace-results-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20733

[services.development]
run = "pnpm --filter @workspace/ace-results-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ace-results-portal", "run", "build" ]
publicDir = "artifacts/ace-results-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20733"
BASE_PATH = "/"
